<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>財富管理分析工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>

/* Layout idea: iPad-landscape consulting console. Left = the client's 理財階梯 (climb from ① at the bottom),
   right = the step's analysis. One light, print-like world so what the client sees matches the PDF. */
:root{
  --ink:#15222C;        /* text, headings */
  --slate:#5A6B75;      /* secondary text */
  --paper:#EDF1F0;      /* page background, cool porcelain */
  --card:#FFFFFF;
  --line:#D6DEDC;
  --jade:#1E6B5C;       /* accent: assets, actions */
  --jade-soft:#E3F0EC;
  --gold:#A9792A;       /* 傳承 / highlight */
  --brick:#B04839;      /* liabilities, expenses */
  --good:#2D7A4C; --warn:#B9820F; --bad:#B04839;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang HK","Heiti TC","Microsoft JhengHei",sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.tile b,td.n,.legend .v{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 16px;background:var(--ink);color:#fff}
.brand{font-family:var(--display);font-size:18px;letter-spacing:.06em;white-space:nowrap}
.client{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.client input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:5px 8px;color:#fff;width:7.5em}
.client input.age{width:4.2em;text-align:center}
.client label{font-size:12px;opacity:.75}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:#fff;padding:6px 14px;cursor:pointer;opacity:.75}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);opacity:1;font-weight:700}
.top .spacer{flex:1}
.tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;white-space:nowrap;min-height:38px}
.tbtn.primary{background:var(--jade);border-color:var(--jade)}
.tbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7FC4B4;outline-offset:2px}
.demo-flag{background:var(--gold);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px 18px 40px;max-width:1500px;margin:0 auto}
@media (max-width:900px){.shell{grid-template-columns:1fr}}

/* ---------- ladder ---------- */
.ladder{display:flex;flex-direction:column;gap:10px;align-self:start;position:sticky;top:76px}
@media (max-width:900px){.ladder{position:static}}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button:first-child{grid-column:1/-1;background:var(--ink);color:#fff;border-color:var(--ink)}
.tools button:first-child[aria-current="page"]{background:var(--jade);border-color:var(--jade)}
.tools button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;min-height:44px}
.tools button[aria-current="page"]{border-color:var(--jade);background:var(--jade-soft);font-weight:700}
.stairs{display:flex;flex-direction:column-reverse;gap:8px}
.stage{background:var(--card);border-radius:var(--r);padding:10px 10px 8px;border:1px solid var(--line)}
.stage h2{font-family:var(--display);font-size:16px;letter-spacing:.12em;color:var(--slate);padding:0 4px 6px}
.steps{display:flex;flex-direction:column-reverse;gap:4px}
.step{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:9px;padding:8px 8px;cursor:pointer;text-align:left;min-height:44px}
.step:hover{background:var(--paper)}
.step[aria-current="page"],.step.here{background:var(--jade-soft)}
.step.here .t{font-weight:700}
.rung{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--jade);background:var(--jade-soft);border-radius:999px;padding:1px 8px;vertical-align:1px}
.step .t{font-weight:500;font-size:14px}
.chip{font-size:12px;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--paper);color:var(--slate)}
.chip.good{background:#E1F0E6;color:var(--good)}
.chip.warn{background:#F8EDD3;color:#8A5F06}
.chip.bad{background:#F5E0DC;color:var(--bad)}

/* ---------- main ---------- */
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;justify-content:space-between}
.vhead h1{font-family:var(--display);font-size:28px;letter-spacing:.06em}
.vhead p{margin:2px 0 0;color:var(--slate);max-width:62ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-in{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1300px){.pgrid{grid-template-columns:1fr!important}}
@media (max-width:760px){.g2,.g3,.g-in{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;border:1px solid var(--line);min-width:0;container-type:inline-size}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .bar{width:4px;height:16px;border-radius:2px;background:var(--jade)}

.hint{font-size:13px;color:var(--slate);margin:6px 0 0}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:13px;color:var(--slate)}
.tile b{font-size:clamp(17px,1.7vw,22px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12px;color:var(--slate)}
.tile.hero{background:var(--jade-soft);border-color:#B9D9CF}
.tile.hero b{color:var(--jade)}
.tile.neg b{color:var(--brick)}

/* fields */
.fields{display:grid;gap:8px}
.f{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:10px}
.f>span{font-size:14px}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:#FAFCFB;overflow:hidden}
.inp i{font-style:normal;font-size:12px;color:var(--slate);padding:0 0 0 9px}
.inp input,.inp select{border:0;background:none;width:100%;padding:9px 9px;text-align:right;min-height:40px;font-variant-numeric:tabular-nums}
.inp:focus-within{border-color:var(--jade)}
.f.total{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.f.total .val{text-align:right}
.sep{height:1px;background:var(--line);margin:4px 0}
.range{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.range input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--jade);height:32px}
.range b{font-variant-numeric:tabular-nums}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{fill:var(--slate);font-size:12px;font-family:var(--body)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;border-radius:8px;padding:6px 9px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.donutwrap{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:16px;align-items:center}
@container (max-width:560px){.donutwrap{grid-template-columns:1fr}.donutwrap>.chart{max-width:210px;margin:0 auto;width:100%}.legend{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));column-gap:16px}}
.legend{display:grid;gap:5px;font-size:13px}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .p{color:var(--slate);min-width:3.2em;text-align:right}
.keylist{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--slate);margin-top:8px}
.keylist span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.keylist span.dash::before{height:0;border-top:2px dashed var(--c);border-radius:0;background:none;width:14px}

.progress{height:14px;border-radius:999px;background:var(--paper);overflow:hidden}
.progress div{height:100%;background:var(--jade);border-radius:999px}
.flow{display:flex;height:34px;border-radius:9px;overflow:hidden}
.flow div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;white-space:nowrap;overflow:hidden;min-width:0}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:500;color:var(--slate);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:6px;border-bottom:1px solid var(--paper);text-align:right;white-space:nowrap}
table.t tr.hl td{background:var(--jade-soft);font-weight:700}
.tscroll{overflow-x:auto}
table.t input{width:100%;min-width:72px;border:1px solid var(--line);border-radius:7px;padding:6px;text-align:right;background:#FAFCFB;font-variant-numeric:tabular-nums}
table.t input.txt{text-align:left;min-width:130px}

.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.ghost{background:none}
.btn.danger{color:var(--brick)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--paper);color:var(--slate)}
.pill.good{background:#E1F0E6;color:var(--good)}.pill.warn{background:#F8EDD3;color:#8A5F06}.pill.bad{background:#F5E0DC;color:var(--bad)}
.checks{display:grid;gap:6px}
.checks button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid var(--paper);padding:8px 2px;text-align:left;cursor:pointer}
.checks .no{font-family:var(--display);color:var(--slate);width:1.6em}
.ph{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--slate);background:rgba(255,255,255,.5)}
.disclaimer{font-size:12px;color:var(--slate);border-top:1px solid var(--line);padding-top:10px;max-width:90ch}

/* modal */
.modal{position:fixed;inset:0;background:rgba(21,34,44,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow:auto}
.modal.on{display:flex}
.dlg{background:var(--card);border-radius:18px;max-width:980px;width:100%;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-family:var(--display);font-size:22px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--slate);cursor:pointer;background:var(--paper)}
.drop.over{border-color:var(--jade);background:var(--jade-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img{height:84px;border-radius:8px;border:1px solid var(--line)}
.status{font-size:14px;color:var(--slate);min-height:1.5em}
.status.err{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--jade);color:#fff;border-color:var(--jade)}
.lbl{font-size:13px;color:var(--slate);margin:6px 0 6px}
.src{font-size:12px;color:var(--slate);margin:6px 0 0;line-height:1.5}
.ro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;min-height:40px}
.ro b{font-variant-numeric:tabular-nums}
.cmpbar{display:grid;gap:8px;margin:8px 0}
.cmpbar .r{display:grid;grid-template-columns:4.5em minmax(0,1fr) 7em;gap:8px;align-items:center;font-size:13px}
.cmpbar .trk{height:14px;background:var(--paper);border-radius:7px;overflow:hidden}
.cmpbar .trk i{display:block;height:100%;border-radius:7px}
.customrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center}
.customrow input.name{border:1px dashed var(--line);border-radius:9px;padding:8px;background:none;min-height:40px;width:100%}
.chk{width:22px;height:22px;accent-color:var(--jade)}
.morebtn{margin-left:auto;font-weight:400}
.card:not(.showall) .more.zero{display:none}
.present .inputs{display:none!important}
.present .g-in{grid-template-columns:minmax(0,1fr)}
.present .vhead p,.present .hint,.present .morebtn,.present #btnAI,.present #btnOpen,.present #btnSave,.present #btnNew{display:none}
.present .client input{pointer-events:none;border-color:transparent;background:none}
.present #btnPresent{background:#fff;color:var(--ink)}
.nextbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.nextbar .stepno{font-size:13px;color:var(--slate)}
.nextbar .stepno b{color:var(--ink);font-size:15px}
.gstep{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--paper)}
.gstep:last-child{border-bottom:0}
.gstep .n{width:2.2em;height:2.2em;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-weight:700}
.gstep h4{margin:0 0 2px;font-size:15px}
.gstep p{margin:2px 0;font-size:14px;color:var(--slate)}
.gstep .say{color:var(--ink)}
.gstep .say::before{content:"同客講：";color:var(--jade);font-weight:700}
.present .nextbar .btn.ghost{display:none}
.planbanner{background:#FFF6E0;border:1px solid #E9D49A;color:#6B4D08;border-radius:10px;padding:8px 12px;font-size:14px}
.planbanner[hidden]{display:none}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.item h4{margin:0;font-size:14px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px}
.item h4 input{width:100%;min-width:0;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;font-weight:700;background:none;min-height:38px}
.item .pill{white-space:nowrap}
#n-items{grid-template-columns:minmax(0,1fr)}
table.t td:first-child{white-space:normal}
.linkbtn{background:none;border:0;color:var(--jade);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.ladder,.noprint{display:none!important}.shell{display:block;padding:0}}

/* ---- v0.11 additions ---- */
.rangechips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 6px;font-size:12px;color:var(--slate)}
.rangechips button{font-size:12px;padding:4px 10px;min-height:32px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer}
.rangechips button[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:700}
.approxnote{display:inline-block;font-size:13px;color:#8A5F06;background:#F8EDD3;border-radius:999px;padding:1px 10px;vertical-align:2px}
.star{font-style:normal;color:#B08A3E}
.focus{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:#8A5F06;background:#F8EDD3;border-radius:999px;padding:1px 8px;vertical-align:1px}
.card.ins .insbig{font-size:24px;font-weight:700;color:var(--jade);margin:2px 0 6px}
.card.ins .instext{margin:6px 0 8px;color:var(--ink);font-size:15px;line-height:1.6}
#g-worry button{font-size:14px}
/* ---- v0.10 additions ---- */
.depth{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;vertical-align:1px}
.depth.d1{background:#E1F0E6;color:var(--good)}.depth.d2{background:#F8EDD3;color:#8A5F06}.depth.d3{background:#F5E0DC;color:var(--bad)}.depth.d0{background:var(--paper);color:var(--slate)}
.firstmeet{display:inline-block;margin-top:4px;font-size:13px;color:#8A5F06}
.gdiv{margin:6px 0;padding:8px 12px;border-radius:10px;background:#FFF6E0;border:1px dashed #E9D49A;color:#6B4D08;font-size:13px;text-align:center}
/* ---- v0.8 additions ---- */
.startgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.startcard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;min-height:96px}
.startcard b{font-size:17px}.startcard span{font-size:14px;color:var(--slate);line-height:1.5}
.startcard:hover{border-color:var(--jade)}
.startcard.primary{background:var(--jade-soft);border-color:#B9D9CF}
.startcard.static{cursor:default}.startcard.static .btn,.startcard.static .row{margin-top:auto}
.pvbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;max-height:60vh;overflow:auto;background:var(--paper);padding:12px;border-radius:12px}
.pvbox canvas.pv{width:100%;height:auto;box-shadow:0 2px 10px rgba(21,34,44,.15);background:#fff}
/* ---- v0.7 additions ---- */
.savestate{font-size:12px;opacity:.75;white-space:nowrap}
#btnMenu.dot{position:relative}
#btnMenu.dot::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#E5624F;border:2px solid var(--ink)}
.menu button em{font-style:normal;font-size:12px;color:var(--brick);margin-left:6px}
.menu button.muted{color:var(--slate);font-size:13px;border-top:1px solid var(--line);border-radius:0 0 8px 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:min(560px,92vw)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.present .savestate{display:none}
/* ---- v0.6 additions ---- */
.clientchip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;min-height:40px;text-align:left}
.clientchip b{font-size:15px}.clientchip span{font-size:13px;opacity:.8}.clientchip i{font-style:normal;opacity:.7}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(21,34,44,.18);padding:6px;display:grid;min-width:200px;z-index:40}
.menu[hidden]{display:none}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:42px}
.menu button:hover{background:var(--paper)}
.answer{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--jade);border-radius:var(--r);padding:14px 18px;font-size:18px;line-height:1.65;max-width:none}
.answer:empty{display:none}
.answer b{color:var(--jade)} .answer b.bad{color:var(--brick)}
.howbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--slate);min-height:38px;white-space:nowrap}
.howbtn:hover{color:var(--ink);border-color:var(--jade)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-2px 0 8px}
.tgl{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:13px}
.tgl[aria-pressed="true"]{background:#F4EBD8;border-color:#D8C08A;color:#6B4D08}
.pills{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--slate)}
details.card>summary{list-style:none;cursor:pointer;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";margin-left:auto;color:var(--slate);font-weight:400}
details.card[open]>summary::after{content:"－"}
details.card>summary .bar{width:4px;height:16px;border-radius:2px;background:var(--jade)}
.drawerwrap{justify-content:flex-end;align-items:stretch;padding:0}
.drawer{background:var(--card);width:min(600px,94vw);height:100%;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:-10px 0 30px rgba(21,34,44,.18)}
.drawer h2{font-family:var(--display);font-size:20px}
.how{display:grid;gap:14px}
.howsec h4{margin:0 0 6px;font-size:15px}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:9px 0;border-bottom:1px solid var(--paper);font-size:14px}
.fx small{display:block;color:var(--slate);font-size:13px;margin-top:2px;line-height:1.5}
.fx>span{font-variant-numeric:tabular-nums;text-align:right;max-width:22em}
.srclist{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:13px;color:var(--slate)}
.card.how h3 .linkbtn{font-weight:400}
.present .howbtn{opacity:.6}
.present .answer{font-size:20px}
.present .menuwrap{display:none}


/* v0.12 time & risk, review history */
.rkout{margin-top:10px}
.rkout .instext{margin:6px 0;color:var(--ink);font-size:15px;line-height:1.6}
table.rkt td{vertical-align:top}
table.rkt td small{display:block;font-size:11px;color:var(--slate);font-weight:400;white-space:normal}
table.rkt td.lv{white-space:normal;min-width:8.5em;font-weight:700}
.rkin{grid-template-columns:repeat(2,minmax(0,1fr))}
.rkapply{margin-top:10px;gap:10px;align-items:center}
.rkapply .btn[disabled]{opacity:.6;cursor:default}
.rkscam{margin-top:10px;padding:10px 12px;border-radius:10px;background:#F8EDD3;color:#6B4A05}
.rvline{font-size:15px;line-height:1.6;margin:2px 0 8px}
.rvline b.bad{color:var(--bad)}
.rvevery{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 10px;font-size:13px;color:var(--slate)}
#rv-cmp .lbl{margin:6px 0 4px}
table.rvt caption{text-align:left;margin:14px 0 4px;caption-side:top}
#rv-cmp .up{color:var(--good);font-weight:700}
#rv-cmp .down{color:var(--bad);font-weight:700}
table.rvt td:nth-child(6){min-width:12em}
.rvrow{margin-top:10px;gap:8px;flex-wrap:nowrap}
.rvnote{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:15px;background:#FAFCFB}
.svrv{display:flex;gap:10px;align-items:flex-start;margin:4px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--jade-soft);cursor:pointer}
.svrv input{width:20px;height:20px;margin-top:2px;accent-color:var(--jade)}
.svrv span{display:grid;gap:2px;font-weight:700}
.svrv small{font-weight:400;color:var(--slate);font-size:12px}
.present .rvrow,.present .rvdel,.present .rkapply,.present .rvevery{display:none}

/* v0.13 savings rate, education */
.ratebar .rb{position:relative;height:16px;border-radius:8px;background:var(--paper);margin:14px 0 22px}
.ratebar .rb i{display:block;height:100%;border-radius:8px}
.ratebar .mk{position:absolute;top:18px;transform:translateX(-50%);font-size:11px;color:var(--slate)}
.ratebar .mk::before{content:"";position:absolute;left:50%;top:-20px;width:1px;height:18px;background:var(--slate);opacity:.5}
.edukid{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--paper);font-size:14px}
.edukid label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.edukid .eduv{grid-column:1/3}
.edukid [data-edu-del]{justify-self:end}
.edukid input{width:3.2em;border:1px solid var(--line);border-radius:7px;padding:6px;text-align:right;font-size:15px;background:#FAFCFB}
.edukid select{min-width:0;border:1px solid var(--line);border-radius:7px;padding:7px;font-size:14px;background:#FAFCFB}
.edukid .eduv{font-size:13px;color:var(--ink);white-space:nowrap}
#edu-add{margin:10px 0 4px}
.eduinf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0;font-size:13px;color:var(--slate)}
#edu-sum .instext{margin:6px 0;font-size:15px;line-height:1.6}
.edufill{gap:8px;flex-wrap:wrap}
.edufill .btn[disabled]{opacity:.55;cursor:default}
.edusrc{margin-top:10px}.edusrc>summary{cursor:pointer;font-size:13px;color:var(--jade);font-weight:700}
.edusrc td.lv{white-space:normal;min-width:9em;font-weight:700}
.edusrc td small{display:block;font-size:11px;color:var(--slate);font-weight:400}


/* v0.15 stream source */
.srccell{display:grid;grid-template-columns:minmax(10.5em,auto) minmax(8em,1fr);gap:6px}
table.t select{border:1px solid var(--line);border-radius:7px;padding:6px;background:#FAFCFB;font-size:13px;min-width:0}
.srcnote{display:block;text-align:left;font-size:11px;color:var(--slate);margin-top:3px;white-space:normal}
.srcnote .warn{color:#8A5F06}

.pctin{display:flex;align-items:center;gap:4px}.pctin input{min-width:56px!important;width:64px}.pctin span{color:var(--slate);font-size:13px}

/* v0.16 life scenarios */
.evrow{border-top:1px solid var(--paper);padding:10px 0}
.evtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.evtop b{min-width:5em}
.evtop .linkbtn{margin-left:auto}
.evflds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.evf{display:grid;gap:3px;font-size:12px;color:var(--slate)}
.evi{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#FAFCFB}
.evi i{font-style:normal;font-size:12px;color:var(--slate)}
.evi input{border:0;background:none;width:100%;min-width:0;text-align:right;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;padding:4px 0}
.evtop .evf{grid-auto-flow:column;align-items:center;gap:6px}.evtop .evi{width:6.5em}
.lfhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}.lfhead h3{margin:0}
#lf-add{margin-bottom:6px}#lf-test{margin-bottom:6px}
#lf-cover .cmpbar .r{grid-template-columns:minmax(0,11.5em) minmax(0,1fr) 5em}

/* v0.17 teaching mode */
body:not(.teach) .t-only{display:none!important}
.tnote{display:block;margin-top:4px;color:#8A5F06;font-size:13px}
.teachflag{background:#8A5F06}

/* v0.17 life: point-form answer, plan on/off */
.anslist{margin:0;padding-left:1.2em;display:grid;gap:6px}
.anslist ul{margin:4px 0 0;padding-left:1.2em;display:grid;gap:2px}
.anslist .warnli{list-style:none;margin-left:-1.2em}
.evtgl{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;min-width:6.5em}
.evtgl i{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;flex:none;transition:background .15s}
.evtgl i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.evtgl[aria-pressed="true"] i{background:var(--jade)}.evtgl[aria-pressed="true"] i::after{left:16px}
.evrow.off .evtgl{color:var(--slate)}.evrow.off .evi{opacity:.55}
.evst{font-size:12px;color:var(--slate)}

/* v0.18 five pillars */
.pillars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pillar{display:grid;justify-items:center;text-align:center;gap:4px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:#FAFCFB}
.pillar svg{width:30px;height:48px;fill:var(--jade)}
.pillar b{font-size:13px}.pillar small{font-size:11px;color:var(--slate);line-height:1.4}
.pillar .pv{font-size:13px;font-weight:700;color:var(--jade);line-height:1.5}
.pillar.off svg{fill:#C5CDD0}.pillar.off .pv{color:var(--bad)}
.pillar.na{background:var(--paper)}.pillar.na svg{fill:#D6DEDC}.pillar.na .pv{color:var(--slate);font-weight:400}
@media (max-width:760px){ .pillars{grid-template-columns:repeat(3,minmax(0,1fr))} }
table.t select optgroup{font-weight:700}

#lf-cancer{margin-bottom:8px}#lf-cancer button{display:grid;line-height:1.2;padding:6px 12px}#lf-cancer small{font-size:10px;opacity:.8}

/* v0.20 worry groups */
.wgrp{padding:6px 0 8px;border-top:1px solid var(--paper)}.wgrp:first-child{border-top:0;padding-top:0}
.wgrp .lbl{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font-weight:700;color:var(--ink)}
.wcnt{font-size:11px;font-weight:700;color:var(--jade);background:var(--jade-soft);border-radius:999px;padding:1px 8px}.wcnt:empty{display:none}

.menuver{display:block;padding:6px 14px 2px;font-size:11px;color:var(--slate)}
</style>
</head>
<body>

<div class="shell">

</div>

<!-- client settings -->

    <div id="cl-body"></div>

</div>

<!-- start screen -->

<!-- save dialog -->

<!-- 計算方法 drawer -->

<script>

"use strict";
/* ================= utilities ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const N = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
const sum = a => a.reduce((s,x)=>s+N(x),0);
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (v, cur="HK$") => { const n=Math.round(N(v)); return (n<0?"-":"")+cur+Math.abs(n).toLocaleString("en-US"); };
const wan = v => { const n=N(v), a=Math.abs(n), s=n<0?"-":"";
  if(a>=1e8) return s+(a/1e8).toFixed(a>=1e9?0:1)+"億";
  if(a>=1e4){ const w=a/1e4; return s+(w>=100? Math.round(w).toLocaleString("en-US") : String(Math.round(w*10)/10))+"萬"; }
  return s+Math.round(a).toLocaleString("en-US"); };
const pct = (v,d=0) => (Number.isFinite(v)? (v*100).toFixed(d) : "–")+"%";
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const clone = o => JSON.parse(JSON.stringify(o));
function getP(o,p){ return p.split(".").reduce((x,k)=>x==null?x:x[k],o); }
function setP(o,p,v){ const ks=p.split("."); let x=o; ks.slice(0,-1).forEach(k=>{ if(x[k]==null) x[k]={}; x=x[k]; }); x[ks.at(-1)]=v; }
function deepMerge(base,o){ if(o==null||typeof o!=="object"||Array.isArray(o)) return o===undefined?base:o; const r=Array.isArray(base)?[]:{...base}; for(const k in o){ r[k]= (base&&typeof base[k]==="object"&&!Array.isArray(base[k])&&base[k]!==null)? deepMerge(base[k],o[k]) : o[k]; } return r; }
const FX = { HKD:1, USD:7.8, RMB:1.08, "其他":1 };
const APP_VERSION = "v0.20";
// v0.17: 教學模式（記喺呢部機）。關 = 見客用：只出規劃／分析／一齊嘅字眼；開 = 培訓同事：出流程、講咩、做咩
let TEACH=false; try{ TEACH=localStorage.getItem("wt-teach")==="1"; }catch(e){}

/* ================= data model ================= */
/* colour system: one meaning per colour, same category = same colour on every page */
const CC = { main:"#1E6B5C", compare:"#9AA7AD", stress:"#B08A3E", target:"#B08A3E", spend:"#B04839", guar:"#34495A", muted:"#5A6B75" };
const CAT = { emergency:"#C5CDD0", bank:"#9AA7AD", propertySelf:"#34495A", propertyInvest:"#6A8394", stable:"#1E6B5C", growth:"#56A38A", passive:"#9CCDBB", retire:"#B08A3E", annuity:"#C98F4A", medReserve:"#D8C08A", legacy:"#8A6A2E", custom:"#B7B1A6" };
const SEQ = ["#1E6B5C","#56A38A","#9CCDBB","#34495A","#6A8394","#B08A3E","#D8C08A","#B7B1A6"];
// [key, label, isKeyField]
const ASSETS = [["emergency","應急備用現金",1],["bank","銀行存款（活期／定期）",1],["propertySelf","自住物業（市值）",1],["propertyInvest","投資物業（市值）",0],["stable","穩陣投資",1],["growth","進取投資",1],["passive","收息資產（派息基金、債券等）",0],["retire","退休儲備（含 MPF）",1],["annuity","年金（現金價值）",1],["medReserve","終身優質私家醫療儲備戶口",0],["legacy","財富傳承資產",0],["custom","其他",0]];
const LIQUID = ["stable","growth","passive","retire"];
// v0.18: 退休保障五大支柱（世界銀行框架）；被動收入來源按支柱分組
const PILLARS = [
  {n:0, l:"第零柱", t:"社會保障", d:"政府補底，唔使供款", ex:"長者生活津貼、生果金、綜援"},
  {n:1, l:"第一柱", t:"公共退休金", d:"政府管理嘅公共退休金", ex:"香港未設全民退休金（較弱）"},
  {n:2, l:"第二柱", t:"強制退休金", d:"強制供款", ex:"強積金 MPF、職業退休計劃"},
  {n:3, l:"第三柱", t:"自願儲蓄", d:"自己儲、自己揀", ex:"自願供款 TVC、年金、儲蓄保險、投資"},
  {n:4, l:"第四柱", t:"非財務支援", d:"家庭同實物支援", ex:"自住物業／逆按揭、醫療券、家庭供養"}
];
// [來源, 選單名, 自動名稱, 支柱, 對應資產, 預設（新項目先用）]
const STREAM_SRC = [
  ["","自己填","",3,null],
  ["oala","長者生活津貼（65 歲起，要審查）","長者生活津貼",0,null,{annual:52140,start:65,grow:2}],
  ["oaa","高齡津貼・生果金（70 歲起）","生果金",0,null,{annual:20100,start:70,grow:2}],

function lerpRows(anchors, n){ const ks=Object.keys(anchors).map(Number).sort((a,b)=>a-b); const out=[];
  for(let y=1;y<=n;y++){ let lo=ks[0],hi=ks.at(-1); for(const k of ks){ if(k<=y) lo=k; if(k>=y){hi=k;break;} }
    out.push(lo===hi? anchors[lo] : anchors[lo]+(anchors[hi]-anchors[lo])*(y-lo)/(hi-lo)); } return out; }

function migrate(o){
  o=clone(o); let v=N(o.v)||1;
  if(v<2){
    if(o.assets && o.assets.property!=null){ o.assets.propertySelf=N(o.assets.property); delete o.assets.property; }
    const pas=N(o.income&&o.income.passive); if(o.income) delete o.income.passive;
    o.streams=o.streams||[];
    if(pas>0) o.streams.unshift({name:"現有被動收入", start:N(o.meta&&o.meta.age)||40, end:95, annual:pas*12, grow:true});
    o.streams.forEach(s=>{ if(s.grow==null) s.grow=false; });
    if(o.plan){ o.plan.postReturnPct=o.plan.postReturnPct??3; o.plan.inflationPct=o.plan.inflationPct??3; o.plan.retireStyle=o.plan.retireStyle||"now"; }
    if(o.premiums&&o.premiums.savingsPlan==null) o.premiums.savingsPlan=0;
    if(o.meta && N(o.meta.lifeAge)<=85) o.meta.lifeAge=95;
    v=2;
  }
  if(v<3){ // v0.6: medical spending, group cover, spouse age, property release
    o.plan=o.plan||{}; o.plan.medSpend=o.plan.medSpend??0; o.plan.medInflationPct=o.plan.medInflationPct??5; o.plan.release=o.plan.release||{on:false,age:75,amount:0};
    o.covers=o.covers||{}; o.covers.groupLife=o.covers.groupLife??0;
    o.meta=o.meta||{}; o.meta.spouseAge=o.meta.spouseAge??0;
    o.view=o.view||{real:false,stress:true};
  }
  if(v<4){ // v0.13: 儲蓄型保險由「每月保費」搬去「每月儲蓄點分配」
    o.monthly=o.monthly||{}; const pr=o.premiums||{};
    ["medReserve","savingsPlan"].forEach(k=>{ o.monthly[k]=N(o.monthly[k])+N(pr[k]); delete pr[k]; });
  }
  if(v<5){ // v0.14: 儲蓄／退休保險併入穩陣投資
    o.monthly=o.monthly||{}; const sp=N(o.monthly.savingsPlan); if(sp) o.monthly.stable=N(o.monthly.stable)+sp; delete o.monthly.savingsPlan;
  }
  o.v=5;
  const r=deepMerge(blankShape(), o); r.streams=o.streams||[]; r.proposals=o.proposals||[]; r.scn=o.scn||{show:false,items:[]};
  r.goals={worries:(o.goals&&o.goals.worries)||[], other:(o.goals&&o.goals.other)||""}; r.approx=o.approx||{};
  r.reviews=Array.isArray(o.reviews)? o.reviews.filter(x=>x&&x.d) : [];
  r.streams.forEach(x=>{ x.grow = x.grow===true? (N(r.plan.inflationPct)||3) : N(x.grow); }); // v0.16: 跟通脹（是／否）→ 每年加幅 %
  r.edu={infl:N(o.edu&&o.edu.infl)||5, kids:(o.edu&&Array.isArray(o.edu.kids))? o.edu.kids : []};
  r.life={plans:(o.life&&Array.isArray(o.life.plans))? o.life.plans : [], test:(o.life&&o.life.test&&o.life.test.type)? o.life.test : {type:""}, mem:(o.life&&o.life.mem)||{}};
  return r;
}

/* ================= plan layer ================= */
const planOn = () => !!(S.scn && S.scn.show && S.scn.items.length);
function applyPlan(B){
  const X=clone(B); X.extraPremProt=0; X.extraPremSave=0; X.lumpAtRetire=0; X.policies=[];
  (B.scn.items||[]).forEach(it=>{
    if(it.type==="invest"){ X.monthly.retire=N(X.monthly.retire)+N(it.monthly); const l=N(it.lump); X.assets.bank=N(X.assets.bank)-l; X.assets.retire=N(X.assets.retire)+l; }
    if(it.type==="policy"){ if(N(it.payYears)>0) X.extraPremSave+=N(it.annualPremium)/12; X.policies.push({annual:N(it.annualPremium),years:N(it.payYears)}); X.lumpAtRetire+=N(it.lumpAtRetire);
      if(N(it.wAnnual)>0) X.streams.push({name:it.name+"（提取）",start:N(it.wStart),end:N(it.wEnd),annual:N(it.wAnnual),grow:0}); }
    if(it.type==="cover"){ ["life","ci","medical","accident"].forEach(k=>X.covers[k]=N(X.covers[k])+N(it[k])); X.extraPremProt+=N(it.premium); }
  });
  return X;
}
function eff(){ return planOn()? applyPlan(S) : S; }

/* ================= calculations ================= */
function compute(X, opt={}){
  X = X || eff();
  const D={X}; const age=N(X.meta.age), ret=Math.max(N(X.meta.retireAge),age);
  D.lifeBase=N(X.meta.lifeAge)||95;
  D.spouseGap = (X.meta.household==="couple" && N(X.meta.spouseAge)>0)? Math.max(0, age-N(X.meta.spouseAge)) : 0;
  const life=Math.max(D.lifeBase + D.spouseGap, ret+1);
  const sh = opt.stress? {r:-0.02, i:0.01} : {r:0, i:0};
  const inf=N(X.plan.inflationPct)/100+sh.i, medInf=N(X.plan.medInflationPct)/100+sh.i;
  const rPre=Math.max(0,N(X.plan.returnPct)/100+sh.r), rPost=Math.max(0,N(X.plan.postReturnPct)/100+sh.r);
  Object.assign(D,{age,ret,life,inf,medInf,rPre,rPost}); D.yield=N(X.plan.yieldPct)/100;
  D.ages=[]; for(let a=age;a<=life;a++) D.ages.push(a);
  const grow=(a)=>Math.pow(1+inf,a-age);
  D.defl = a => Math.pow(1+N(X.plan.inflationPct)/100, a-age);   // for 今日價錢 display (base inflation)
  const sRate = s => typeof s.grow==="number"? s.grow : s.grow===true? N(X.plan.inflationPct) : N(s.grow); // v0.16: 每項自己嘅每年加幅（%）
  const sAt = (s,a) => (a>=N(s.start)&&a<=N(s.end))? N(s.annual)*Math.pow(1+sRate(s)/100,a-age) : 0;
  D.streamAt = a => sum(X.streams.map(s=>sAt(s,a)));
  D.streamByAge = X.streams.map(s=>D.ages.map(a=>sAt(s,a)));
  // monthly cash flow
  D.passiveM = D.streamAt(age)/12;
  D.inc = N(X.income.active) + D.passiveM;
  const expItems = sum(EXP.map(([k])=>X.expenses[k]));
  D.avgExp = expItems>0 ? expItems : N(X.expTotal);
  D.reas = N(X.reasonable) || D.avgExp;
  D.premProt = sum(PREM_PROT.map(([k])=>X.premiums[k])) + N(X.extraPremProt);
  D.premSave = N(X.monthly.medReserve) + N(X.extraPremSave); // 醫療儲備＋方案儲蓄計劃：屬於儲蓄，唔係支出
  D.prem = D.premProt;
  D.netAvg = D.inc - D.avgExp - D.prem;
  D.savAvail = D.inc - D.reas - D.prem;
  D.saveRate = D.inc? D.savAvail/D.inc : NaN;
  D.premRatio = D.inc? D.premProt/D.inc : NaN;
  D.monthlyAlloc = sum(MONTHLY.map(([k])=>X.monthly[k])) + N(X.extraPremSave);
  D.emergencyMonthly = D.savAvail - D.monthlyAlloc;
  D.monthlyInvest = N(X.monthly.stable)+N(X.monthly.growth)+N(X.monthly.dividend)+N(X.monthly.retire);
  // balance sheet
  D.assets = sum(ASSETS.map(([k])=>X.assets[k]));
  D.liabs = sum(LIABS.map(([k])=>X.liabs[k]));
  D.net = D.assets - D.liabs;
  D.liquid = sum(LIQUID.map(k=>X.assets[k]));
  D.cash = N(X.assets.emergency)+N(X.assets.bank);
  D.emMonths = D.avgExp? D.cash/D.avgExp : NaN;
  const al=ASSETS.map(([k,l])=>({l,v:N(X.assets[k])})).sort((a,b)=>b.v-a.v)[0];
  D.biggest=al; D.biggestShare = D.assets? al.v/D.assets : 0;
  // retirement spending: living + extra medical, each with its own inflation (today's money in, future money out)
  D.living = N(X.plan.retireSpend) || D.reas; D.med = N(X.plan.medSpend);
  D.spendToday = D.living + D.med;
  D.spendAt = a => D.living*12*grow(a) + D.med*12*Math.pow(1+medInf,a-age);
  D.shortAt = a => Math.max(0, D.spendAt(a) - D.streamAt(a));
  const rel = X.plan.release||{}; D.releaseOn = !!rel.on && N(rel.amount)>0; D.releaseAge=N(rel.age); D.releaseAmt=N(rel.amount);
  // plan policies: premiums only during paying years; a cash shortfall is funded from investments
  const pols=X.policies||[]; const polPremAt=a=>sum(pols.filter(p=>a-age<p.years).map(p=>p.annual));
  const baseSurplusYr = D.emergencyMonthly*12 + polPremAt(age);
  D.contribAt = a => D.monthlyInvest*12 + Math.min(0, baseSurplusYr - polPremAt(a));
  // path 1: save until retirement, then draw down principal
  const ev=opt.ev||null; D.ev=ev; // v0.16: 人生計劃／意外測試
  let P=D.liquid, Rw=D.liquid; D.path=[]; D.raw=[]; D.depleteAge=null; D.potAtRetire=0; D.borrowAge=null; // raw = 唔封底，用嚟計資產淨值（負數 = 要借錢）
  for(const a of D.ages){
    const e=ev? ev.at(a) : null;
    if(e){ P = P*(1-e.shock) + e.payout - e.cost; Rw = (Rw>0? Rw*(1-e.shock) : Rw) + e.payout - e.cost; }
    if(a===ret){ P+=N(X.lumpAtRetire); Rw+=N(X.lumpAtRetire); D.potAtRetire=P; }
    if(D.releaseOn && a===D.releaseAge){ P+=D.releaseAmt; Rw+=D.releaseAmt; }
    if(P<0 && a<ret && D.borrowAge==null) D.borrowAge=a;
    if(P<0 && a>=ret){ if(D.depleteAge==null) D.depleteAge=a; P=0; }
    D.path.push(P); D.raw.push(Rw);
    const yo=e? e.yrOut : 0;
    if(a<ret){ P = (P>0? P*(1+rPre) : P) + D.contribAt(a) - yo; Rw = (Rw>0? Rw*(1+rPre) : Rw) + D.contribAt(a) - yo; }
    else { P = P*(1+rPost) - D.shortAt(a) - yo; if(P<0){ if(D.depleteAge==null) D.depleteAge=a+1; P=0; } Rw = (Rw>0? Rw*(1+rPost) : Rw) - D.shortAt(a) - yo; }
  }
  D.enough = D.depleteAge==null;
  let need=0; for(let a=ret;a<=life;a++) need += D.shortAt(a)/Math.pow(1+rPost,a-ret+1);
  if(D.releaseOn && D.releaseAge>=ret) need -= D.releaseAmt/Math.pow(1+rPost,D.releaseAge-ret);
  D.needPrincipal = Math.max(0,need);
  D.needInterest = D.yield>0? D.shortAt(ret)/D.yield : 0;
  D.spendAtRetireM = D.spendAt(ret)/12;
  D.streamAtRetireM = D.streamAt(ret)/12;
  D.retireCover = D.spendAt(ret)? (D.streamAt(ret) + D.potAtRetire*D.yield)/D.spendAt(ret) : NaN;
  D.fundedRatio = D.needPrincipal? D.potAtRetire/D.needPrincipal : 1;
  // path 2: keep investing; first age when dividends + other income cover spending
  let Q=D.liquid; D.freeAge=null;
  for(const a of D.ages){ const e=ev? ev.at(a):null; if(e) Q=Q*(1-e.shock)+e.payout-e.cost; if(D.freeAge==null && Q*D.yield + D.streamAt(a) >= D.spendAt(a)+(e?e.extra:0)) D.freeAge=a; Q=(Q>0?Q*(1+rPre):Q)+D.contribAt(a)-(e?e.yrOut:0); }
  D.passiveCover = D.spendAt(age)? (D.streamAt(age)+D.liquid*D.yield)/D.spendAt(age) : NaN;
  // protection needs
  D.lifeHave = N(X.covers.life)+N(X.covers.groupLife);
  D.lifeNeed = Math.max(0, D.liabs + D.reas*12*N(X.protect.years) + N(X.protect.education) - (D.cash+N(X.assets.stable)+N(X.assets.growth)));
  D.lifeGap = Math.max(0, D.lifeNeed - D.lifeHave);
  D.lifeGapNoGroup = Math.max(0, D.lifeNeed - N(X.covers.life));
  D.ciNeed = N(X.protect.ciMultiple)*N(X.income.active)*12;
  D.ciGap = Math.max(0, D.ciNeed - N(X.covers.ci));
  D.legacyTotal = D.lifeHave+N(X.assets.legacy);
  if(!opt.stress && !opt.ev) D.ST = compute(X,{stress:true});
  return D;
}

function statusFor(key,D){
  switch(key){
    case "inventory": return D.assets? {t:"淨值 "+wan(D.net)} : {t:"未填",c:"warn"};
    case "passive": return {t:"覆蓋 "+pct(D.passiveCover), c: D.passiveCover>=1?"good":D.passiveCover>=.5?"warn":"bad"};
    case "spend": return D.avgExp>D.reas ? {t:"可慳 "+wan(D.avgExp-D.reas)+"/月", c:"warn"} : {t:"已控制", c:"good"};
    case "emergency": return {t: Number.isFinite(D.emMonths)? D.emMonths.toFixed(1)+" 個月":"–", c: D.emMonths>=6?"good":D.emMonths>=3?"warn":"bad"};
    case "risk": return (D.lifeGap+D.ciGap)>0? {t:"缺口 "+wan(D.lifeGap+D.ciGap), c:"bad"} : {t:"已足夠", c:"good"};
    case "alloc": return {t:"最大 "+pct(D.biggestShare), c: D.biggestShare>.6?"warn":"good"};
    case "cashflow": return {t:"退休時 "+pct(D.retireCover), c: D.retireCover>=1?"good":D.retireCover>=.6?"warn":"bad"};
    case "review": { const rs=Array.isArray(S.reviews)?S.reviews:[]; if(!rs.length) return {t:"未有紀錄",c:"warn"}; const l=rs.at(-1); const ev=N(S.follow&&S.follow.every)||6; return {t:"上次 "+l.d, c: monthsSince(l.d)>=ev?"warn":"good"}; }
    case "retire": if(!D.spendToday) return {t:"未填",c:"warn"}; return D.enough? {t:"夠用到 "+D.life+" 歲", c:"good"} : {t:"用到 "+D.depleteAge+" 歲", c: D.depleteAge>=D.life-10?"warn":"bad"};
    case "freedom": if(!D.spendToday) return {t:"未填",c:"warn"}; return D.freeAge!=null? {t:D.freeAge+" 歲", c: D.freeAge<=D.ret?"good":"warn"} : {t:"未達標", c:"bad"};
    case "legacy": return {t:wan(D.legacyTotal)};
    case "income": return {t:wan(D.inc)+"/月"};
    case "saverate": return {t:"儲蓄率 "+pct(D.saveRate), c: D.saveRate>=.3?"good":D.saveRate>=.15?"warn":"bad"};
    case "quality": return {t:wan(D.liquid)};
    case "balance": { const lv=RMAP[S.risk&&S.risk.level]; if(lv) return {t:lv.l+"・最多跌 "+lv.drop+"%"}; const a=N(S.assets.stable), b=N(S.assets.growth); return {t: a+b? "穩 "+pct(a/(a+b))+" 進 "+pct(b/(a+b)) : "未揀", c: a+b? "" : "warn"}; }
    case "accum": return {t:"退休時 "+wan(D.potAtRetire)};
  }
  return {t:""};
}

function bindToggles(){

function flowBar(id,keyId,D){
  const parts=[["生活支出",D.reas,"#A65A4E"],["保障保費",D.premProt,"#B08A3E"],["儲蓄及投資",Math.max(0,D.savAvail),CC.main]].filter(p=>p[1]>0);
  const tot=sum(parts.map(p=>p[1]))||1;
  $("#"+id).innerHTML=parts.map(([l,v,c])=>`<div style="width:${v/tot*100}%;background:${c}" title="${l}">${v/tot>.12?pct(v/tot):""}</div>`).join("");
  $("#"+keyId).innerHTML=parts.map(([l,v,c])=>`<span style="--c:${c}">${l} ${money(v)}</span>`).join("");
}
function retireChart(host,D,D0){
  const xs=D.ages, real=isReal(); const f=(arr,DD)=>arr.map((v,i)=> real? v/DD.defl(DD.ages[i]) : v);
  const ser=[{name:"可投資資產",color:CC.main,values:f(D.path,D),area:true}];
  if(S.view.stress && D.ST) ser.push({name:"壓力測試",color:CC.stress,values:f(D.ST.path,D.ST),dash:true,w:2});
  if(D0) ser.push({name:"現況",color:CC.compare,values:f(D0.path,D0).slice(0,xs.length),dash:true,w:2});
  const marks=[{i:xs.indexOf(D.ret),color:CC.muted,label:D.ret+"歲退休",dash:true}];
  if(D.depleteAge!=null) marks.push({i:xs.indexOf(Math.min(D.depleteAge,D.life)),color:CC.spend,label:D.depleteAge+"歲用晒",row:1});
  if(S.view.stress && D.ST && D.ST.depleteAge!=null && D.ST.depleteAge!==D.depleteAge) marks.push({i:xs.indexOf(Math.min(D.ST.depleteAge,D.life)),color:CC.stress,label:"壓力 "+D.ST.depleteAge+"歲",row:2,dash:true,left:true});
  lineChart(host,{xs,series:ser,xFmt:a=>a+"歲",marks});
}

V.protect={ title:"風險管理：保障夠唔夠", sub:"按你嘅家庭責任計保障需要，再同而家有嘅保障比較。", tsub:"見到退休缺口之後先傾，用「保護呢個計劃」做切入。",
  init(){ bindEdu(); },

    <div class="card"><h3><span class="bar"></span>經濟責任</h3><div class="fields">
      ${field("家人生活費預留幾多年","protect.years",{unit:"年"})}${field("仔女教育費（總數）","protect.education")}${field("危疾槓桿資產入息保障：年薪倍數","protect.ciMultiple",{unit:"倍"})}</div>

  </div><div class="grid" style="align-content:start">

  out(D,D0){ const X=D.X;

    setText("p-lg",money(D.lifeGap)); setText("p-lg-s", D0? "現況缺口 "+wan(D0.lifeGap) : "需要 "+wan(D.lifeNeed)+"・現有 "+wan(D.lifeHave));
    setText("p-cg",money(D.ciGap)); setText("p-cg-s", D0? "現況缺口 "+wan(D0.ciGap) : "需要 "+wan(D.ciNeed)+"・現有 "+wan(X.covers.ci));
    setText("p-leg",money(D.legacyTotal)); setText("p-leg-s","身故保障＋財富傳承資產");
    cmpBars($("#p-life"),[{label:"需要",value:D.lifeNeed,color:CC.target},{label:"個人保單",value:N(X.covers.life),color:CC.main},{label:"＋公司",value:D.lifeHave,color:"#56A38A"}]);
    cmpBars($("#p-ci"),[{label:"需要",value:D.ciNeed,color:CC.target},{label:"現有",value:N(X.covers.ci),color:CC.main}]);
    setText("p-group", N(X.covers.groupLife)>0? `唔計公司團體保障，身故缺口係 ${money(D.lifeGapNoGroup)}。` : "");
    setChip("p-m", money(X.covers.medical), N(X.covers.medical)>0?"good":"bad"); setChip("p-a", money(X.covers.accident), N(X.covers.accident)>0?"good":"warn"); renderEdu(); },
  how:D=>{ const X=D.X; const liq=D.cash+N(X.assets.stable)+N(X.assets.growth); return howSec("保障需要點樣計",[
    fxRow("身故保障需要","負債 ＋ 家人生活費 × 年期 ＋ 仔女教育 − 流動資產",`${wan(D.liabs)} ＋ ${wan(D.reas*12*N(X.protect.years))} ＋ ${wan(X.protect.education)} − ${wan(liq)} = ${money(D.lifeNeed)}`),
    fxRow("家人生活費","控制後合理支出 × 12 × 預留年期",`${money(D.reas)} × 12 × ${N(X.protect.years)} = ${money(D.reas*12*N(X.protect.years))}`),
    fxRow("流動資產","應急現金 ＋ 銀行存款 ＋ 穩陣投資 ＋ 進取投資（退休儲備同物業唔計）",money(liq)),
    fxRow("現有身故保障","個人保單 ＋ 公司團體人壽",`${wan(X.covers.life)} ＋ ${wan(X.covers.groupLife)} = ${money(D.lifeHave)}`),
    fxRow("身故缺口","需要 − 現有（唔計公司保障：需要 − 個人保單）",`${money(D.lifeGap)}（唔計公司 ${money(D.lifeGapNoGroup)}）`),
    fxRow("危疾槓桿資產入息保障需要","年薪 × 倍數",`${money(N(X.income.active)*12)} × ${N(X.protect.ciMultiple)} = ${money(D.ciNeed)}`),
    fxRow("危疾槓桿資產入息保障缺口","需要 − 現有危疾槓桿資產入息保障",money(D.ciGap)),
    fxRow("仔女教育費（按升學地方）","每個仔女：每年費用（今日價錢）× (1＋教育通脹)^(距離 18 歲嘅年數＋第幾年)，逐年加埋；可以揀填「到時價錢」或者「今日價錢」",S.edu&&S.edu.kids.length? money(eduCalc().fut):"未用")],
    "危疾槓桿資產入息保障以約 5 倍年薪做起點，再按負債、家庭責任同康復期需要調整。公司團體保障轉工或退休會失去。"); }
};

V.freedom={ get title(){ return S.meta.version==="wealth"?"財富自由":"退休自由"; }, sub:"退休前繼續儲錢投資，退休後每年用錢（跟通脹加），睇資金用到幾歲。",
  html:()=>`<div class="tiles">${tile("資金用到","f-dep","hero","f-dep-s")}${tile("退休時預計資金","f-pot","","f-pot-s")}${tile("需要嘅資金","f-np","","f-np-s")}</div>
  <div class="grid g-in"><div class="grid" style="align-content:start">
    <div class="card"><h3><span class="bar"></span>退休想過咩生活（每月，今日價錢）</h3>

    <details class="card inputs adv"><summary><span class="bar"></span>進階假設（通脹、回報、物業）</summary><div class="fields" style="margin-top:10px">
      <p class="lbl" style="margin:0">一般通脹</p>${chips("f-inf",INFL.map(x=>({v:x.v,l:x.l})),S.plan.inflationPct)}
      <div class="range"><label for="${kid("plan.inflationPct")}">每年通脹</label><b id="f-i"></b><input type="range" min="0" max="6" step="0.5" id="${kid("plan.inflationPct")}" data-k="plan.inflationPct"></div>
      <p class="lbl" style="margin:0">醫療通脹</p>${chips("f-minf",MEDINFL.map(x=>({v:x.v,l:x.l})),S.plan.medInflationPct)}
      <div class="range"><label for="${kid("plan.medInflationPct")}">每年醫療通脹</label><b id="f-mi"></b><input type="range" min="0" max="12" step="0.5" id="${kid("plan.medInflationPct")}" data-k="plan.medInflationPct"></div>
      <div class="range"><label for="${kid("plan.returnPct")}">退休前投資年回報</label><b id="f-r"></b><input type="range" min="0" max="10" step="0.5" id="${kid("plan.returnPct")}" data-k="plan.returnPct"></div>
      <div class="range"><label for="${kid("plan.postReturnPct")}">退休後投資年回報</label><b id="f-r2"></b><input type="range" min="0" max="8" step="0.5" id="${kid("plan.postReturnPct")}" data-k="plan.postReturnPct"></div>
      <div class="range"><label for="${kid("plan.yieldPct")}">派息率（只用派息計法）</label><b id="f-y"></b><input type="range" min="2" max="8" step="0.5" id="${kid("plan.yieldPct")}" data-k="plan.yieldPct"></div>
      <div class="sep"></div>
      <label class="ro" for="${kid("plan.release.on")}"><span>退休後釋放物業（換細樓、安老按揭等）</span><input class="chk" type="checkbox" id="${kid("plan.release.on")}" data-k="plan.release.on"></label>
      ${field("幾歲釋放","plan.release.age",{unit:"歲"})}${field("釋放金額（今日價錢，保守唔計升值）","plan.release.amount")}</div></details>
  </div><div class="grid" style="align-content:start">
    <div class="card"><h3><span class="bar"></span>可投資資產：退休前累積，退休後提取</h3>${viewToggles()}<div class="chart" id="f-chart"></div><div class="keylist" id="f-key"></div></div>
    <details class="card"><summary><span class="bar"></span>詳細數字</summary><div class="fields" style="margin-top:10px">
      <div class="ro"><span>退休嗰年每月支出（生活＋醫療）</span><b id="f-a1"></b></div>
      <div class="ro"><span>其他被動收入（時間軸）</span><b id="f-a2"></b></div>
      <div class="ro"><span>每月要由資金補</span><b id="f-a3"></b></div>
      <div class="ro"><span>只用派息、本金留俾下一代，需要</span><b id="f-a4"></b></div>
      <div class="ro"><span>財務自由年齡（繼續投資、唔退休）</span><b id="f-a5"></b></div></div></details>
  </div></div>
  <div class="card"><h3><span class="bar"></span>你嘅退休保障五大支柱</h3><div class="pillars" id="f-pillars"></div>
    <p class="hint" id="f-pil-h"></p><p class="src">框架：世界銀行退休保障「五大支柱」。收入係退休嗰年每年金額（被動收入時間軸）；資產係今日價值。<button type="button" class="linkbtn" data-go="streams">去被動收入時間軸</button></p></div>`,
  init(){
    const applyStyle=()=>{ const st=STYLES.find(s=>s.k===S.plan.retireStyle); if(!st) return;
      if(st.k==="now") S.plan.retireSpend=N(S.reasonable)||sum(EXP.map(([k])=>S.expenses[k]))||N(S.expTotal);
      else if(st.k!=="custom"){ S.plan.retireSpend = S.meta.household==="single"? st.single : (st.couple ?? st.single); }
      bindInputs($("#main")); };
    V.freedom.applyStyle=applyStyle;
    bindChips("f-style",v=>{ S.plan.retireStyle=v; applyStyle(); dirty(); });
    bindChips("f-inf",v=>{ S.plan.inflationPct=N(v); bindInputs($("#main")); dirty(); });
    bindChips("f-minf",v=>{ S.plan.medInflationPct=N(v); bindInputs($("#main")); dirty(); });
    $("#"+kid("plan.retireSpend")).addEventListener("input",()=>{ S.plan.retireStyle="custom"; $$("#f-style button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v==="custom")); });
    bindToggles();
  },
  out(D,D0){
    { const P=pillarStats(D), ico=`<svg viewBox="0 0 40 64" aria-hidden="true"><rect x="4" y="2" width="32" height="7" rx="2"/><rect x="9" y="11" width="22" height="40"/><path d="M15 13v36M20 13v36M25 13v36" stroke="#fff" stroke-width="1.6"/><rect x="5" y="53" width="30" height="9" rx="2"/></svg>`;
      $("#f-pillars").innerHTML=P.map(p=>`<div class="pillar ${p.n===1?"na":p.has?"on":"off"}">${ico}<b>${p.l}・${esc(p.t)}</b><small>${esc(p.ex)}</small>
        <div class="pv">${p.n===1? "香港未設" : p.has? [p.inc>0?`每年 ${wan(p.inc)}`:"", p.ast>0?`資產 ${wan(p.ast)}`:"", p.n===4&&D.releaseOn?"計劃釋放物業":""].filter(Boolean).join("<br>") : "未有"}</div></div>`).join("");
      const miss=P.filter(p=>p.n!==1&&!p.has).map(p=>p.l+p.t);
      setText("f-pil-h", miss.length? `仲未有：${miss.join("、")}。香港冇全民退休金（第一柱），所以第二、三柱同自己嘅規劃特別重要。` : "五條支柱（除咗香港未設嘅第一柱）都有安排。"); }
    const st=STYLES.find(s=>s.k===S.plan.retireStyle);
    setText("f-style-src", st? st.note + (st.couple===null&&S.meta.household==="couple"?"（只有單身數字，二人請按實際調高）":"") : "");
    const spouse = D.spouseGap? `（計到伴侶 ${D.lifeBase} 歲，即你 ${D.life} 歲）` : "";
    const retireTxt = !D.spendToday? "揀咗退休想過咩生活之後，呢度會顯示資金夠用到幾歲。"
      : `按而家嘅安排，退休資金${D.enough? B(depTxt(D)) : BAD(depTxt(D))}${D.enough?"":`，比目標早 ${D.life-D.depleteAge} 年`}${spouse}。`
        +(S.view.stress&&D.ST? ` 如果回報少 2%、通脹多 1%：${D.ST.enough? B("仍然夠用"): BAD("用到 "+D.ST.depleteAge+" 歲")}。`:"")
        +(D0? ` 現況係${depTxt(D0)}。`:"");
    const wealthTxt = !D.spendToday? "" : (D.freeAge!=null? `按而家嘅儲蓄同投資，${B(D.freeAge+" 歲")}做到財務自由（派息加其他收入夠支付生活）。` : `按而家節奏，計到 ${D.life} 歲都未做到財務自由。`);
    ans(S.meta.version==="wealth"? wealthTxt+" "+retireTxt : retireTxt);
    setText("f-dep", !D.spendToday? "未設定" : D.enough? D.life+" 歲以上" : D.depleteAge+" 歲"); setText("f-dep-s", "目標 "+D.life+" 歲"+(S.view.stress&&D.ST? "・壓力測試 "+(D.ST.enough?"夠用":D.ST.depleteAge+" 歲"):""));
    setText("f-pot",money(fut(D,D.potAtRetire,D.ret))); setText("f-pot-s",D.ret+" 歲・"+moneyLbl()+(D0? "・現況 "+wan(fut(D0,D0.potAtRetire,D0.ret)):""));
    setText("f-np",money(fut(D,D.needPrincipal,D.ret))); setText("f-np-s","連本金用到 "+D.life+" 歲・準備程度 "+pct(D.fundedRatio));
    setText("f-i",N(S.plan.inflationPct)+"%"); setText("f-mi",N(S.plan.medInflationPct)+"%"); setText("f-r",N(S.plan.returnPct)+"%"); setText("f-r2",N(S.plan.postReturnPct)+"%"); setText("f-y",N(S.plan.yieldPct)+"%");
    setText("f-a1",money(fut(D,D.spendAtRetireM,D.ret))); setText("f-a2",money(fut(D,D.streamAtRetireM,D.ret))); setText("f-a3",money(fut(D,Math.max(0,D.spendAtRetireM-D.streamAtRetireM),D.ret)));
    setText("f-a4",money(fut(D,D.needInterest,D.ret))); setText("f-a5",D.freeAge!=null? D.freeAge+" 歲":"計到 "+D.life+" 歲都未達到");
    retireChart($("#f-chart"),D,D0); $("#f-key").innerHTML=retireKey(D0); },
  how:D=>{ const yrs=D.ret-D.age; const L=D.living, M=D.med;
    return howSec("退休資金點樣計",[
      fxRow("① 退休嗰年每年支出",`生活 ${money(L)} × 12 × (1＋${N(S.plan.inflationPct)}%)^${yrs} ＋ 醫療 ${money(M)} × 12 × (1＋${N(S.plan.medInflationPct)}%)^${yrs}`,money(D.spendAt(D.ret))),
      fxRow("② 退休前每年",`資金 × (1＋${N(S.plan.returnPct)}%) ＋ 每年投資 ${money(D.monthlyInvest*12)}`,`${D.ret} 歲時 ${money(D.potAtRetire)}`),
      fxRow("③ 退休後每年",`資金 × (1＋${N(S.plan.postReturnPct)}%) − （當年支出 − 其他被動收入）`,""),
      fxRow("④ 資金用到幾歲","資金第一次跌穿零嘅年齡",depTxt(D)),
      fxRow("⑤ 計到幾歲",D.spouseGap? `${D.lifeBase} 歲 ＋ 同伴侶嘅年齡差 ${D.spouseGap} 年（計到較後嗰位）` : `${D.lifeBase} 歲`,D.life+" 歲"),
      fxRow("⑥ 需要嘅資金（連本金用）",`退休後每年缺口，用 ${N(S.plan.postReturnPct)}% 折現返退休嗰年再加埋`,money(D.needPrincipal)),
      fxRow("⑦ 只用派息需要",`退休首年缺口 ${money(D.shortAt(D.ret))} ÷ 派息率 ${N(S.plan.yieldPct)}%`,money(D.needInterest)),
      fxRow("⑧ 壓力測試","回報 −2%、一般同醫療通脹各 +1%，再計一次",D.ST? depTxt(D.ST):"–"),
      fxRow("⑨ 今日價錢",`將來金額 ÷ (1＋${N(S.plan.inflationPct)}%)^年數`,`${wan(D.needPrincipal)} → ${wan(D.needPrincipal/D.defl(D.ret))}`),
      fxRow("⑩ 釋放物業",D.releaseOn? `${D.releaseAge} 歲加入 ${money(D.releaseAmt)}（今日價錢，唔計升值）` : "未開啟",D.releaseOn?"已計入":"–"),
      fxRow("財務自由年齡","繼續投資唔退休，資金 × 派息率 ＋ 其他被動收入 ≥ 當年支出嘅第一個歲數",D.freeAge!=null?D.freeAge+" 歲":"未達")],
      "預測基於假設，實際回報會上落，並非保證。"); }
};

V.streams={ title:"被動收入時間軸", sub:"將來每年會自動入袋嘅錢：政府津貼、強積金、年金、租金、保單提取、家人供養。", tsub:"來源按退休保障五大支柱分組；投資組合派息已計入退休資金，唔使再填。",
  html:()=>`<div class="tiles">${tile("而家每月被動收入","s-now","")}${tile("退休嗰年每月","s-ret","","s-ret-s")}${tile("退休時覆蓋支出","s-cov","hero","s-cov-s")}</div>

  <div class="card inputs"><h3><span class="bar"></span>被動收入表</h3><div class="tscroll"><table class="t"><thead><tr><th>項目</th><th>幾歲開始</th><th>幾歲完結</th><th>每年金額（HK$）</th><th>每年加幅</th><th></th></tr></thead><tbody id="s-rows"></tbody></table></div>

let curProp=0;
function propCalc(p){
  const rows=(p.rows||[]).map(r=>({...r, paid: r.paid!=null&&r.paid!==""? N(r.paid) : N(p.annualPremium)*Math.min(N(r.year),N(p.payYears)||N(r.year))}));
  const be=rows.find(r=>N(r.total)>=r.paid && r.paid>0);
  const irr=r=>{ const n=N(r.year); if(n<=0||!(N(r.total)>0)) return NaN;
    const cf=t=>{ let v=0; for(let y=0;y<n;y++){ if(y<(N(p.payYears)||n)) v-=N(p.annualPremium)/Math.pow(1+t,y); }
      rows.forEach(x=>{ if(N(x.year)<=n && N(x.income)>0) v+=N(x.income)/Math.pow(1+t,N(x.year)); }); return v+N(r.total)/Math.pow(1+t,n); };
    let lo=-0.99,hi=0.5; if(cf(lo)*cf(hi)>0) return NaN; for(let k=0;k<80;k++){ const m=(lo+hi)/2; if(cf(lo)*cf(m)<=0) hi=m; else lo=m; } return (lo+hi)/2; };
  return {rows,be,irr};
}
const curSym = p => p.currency==="HKD"?"HK$":p.currency==="USD"?"US$":p.currency+" ";

function policyFromProposal(p){ const rate=FX[p.currency]||1; const {rows}=propCalc(p); const ra=N(S.meta.retireAge);
  const atRet=rows.find(r=>N(r.age)===ra) || rows.filter(r=>N(r.age)<=ra).at(-1);
  const inc=rows.filter(r=>N(r.income)>0); const avg=inc.length? sum(inc.map(r=>r.income))/inc.length : 0;
  return { type:"policy", name:p.name, annualPremium:Math.round(N(p.annualPremium)*rate), payYears:N(p.payYears),
    lumpAtRetire: inc.length? 0 : Math.round(N(atRet&&atRet.total)*rate), wAnnual:Math.round(avg*rate),
    wStart: inc.length? (N(inc[0].age)||ra) : ra, wEnd: inc.length? (N(inc.at(-1).age)||N(S.meta.lifeAge)) : N(S.meta.lifeAge) }; }

/* ---- calculators ---- */
function grow(initial,monthly,years,ratePct,freq){ const n=N(freq)||1; const im=Math.pow(1+N(ratePct)/100/n, n/12)-1; const out=[N(initial)]; let v=N(initial);
  for(let m=1;m<=Math.round(N(years)*12);m++){ v=v*(1+im)+N(monthly); if(m%12===0) out.push(v); } return out; }
const FREQ=[[1,"每年"],[2,"每半年"],[4,"每季"],[12,"每月"],[365,"每日"]];

    setText("l-tot",money(D.legacyTotal)); setText("l-tot-s","資產淨值 "+wan(D.net)); setText("l-life",money(D.lifeHave)); setText("l-life-s","包括公司團體 "+wan(D.X.covers.groupLife)); setText("l-asset",money(D.X.assets.legacy)); },

};

function riskPaths(A, n, lv){
  // 示例：第 3 年（年期短就第 1–n 年）跌 drop%；坐定定 = 之後 rec 年內慢慢追返預期線；賣出 = 之後轉存款
  const r=lv.r/100, d=lv.drop/100, c=Math.min(3,n), back=c+lv.rec, tgt=A*Math.pow(1+r,back);
  const exp=[], hold=[], sell=[];
  for(let t=0;t<=n;t++){

    if(t===0){ hold.push(A); sell.push(A); continue; }
    if(t<c){ hold.push(hold[t-1]*(1+r)); sell.push(sell[t-1]*(1+r)); }

function addMonths(ds,m){ const [y,mo,d]=String(ds).split("-").map(Number); if(!y) return "–"; const dt=new Date(y,mo-1+N(m),1); const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(Math.min(d,last)).padStart(2,"0"); }
function monthsSince(ds){ const [y,mo,d]=String(ds).split("-").map(Number); if(!y) return 0; const n=new Date(); return (n.getFullYear()-y)*12+(n.getMonth()+1-mo)+(n.getDate()<d?-1:0); }
const reviews = () => Array.isArray(S.reviews)? S.reviews : (S.reviews=[]);
const lastReview = () => reviews().filter(r=>r.d!==today()).at(-1) || null;
function snapReview(D){ return {d:today(), net:Math.round(D.net), sav:Math.round(D.savAvail), gap:Math.round(D.lifeGap+D.ciGap), dep: D.spendToday? (D.enough? D.life : D.depleteAge) : null, enough:!!(D.spendToday&&D.enough)}; }
function recordReview(note){ const D=compute(S); const e=snapReview(D); const rs=reviews(); const i=rs.findIndex(r=>r.d===e.d);
  e.note = note!=null? note : (i>=0? rs[i].note||"" : "");
  if(i>=0) rs[i]=e; else rs.push(e); rs.sort((a,b)=>a.d<b.d?-1:1); dirty(); return e; }
const depShow = r => r.dep==null? "未設定" : r.enough? r.dep+" 歲以上" : r.dep+" 歲";
function delta(a,b,fmt,goodUp=true){ const d=N(b)-N(a); if(!d) return "–"; const good=goodUp? d>0 : d<0; return `<span class="${good?"up":"down"}">${d>0?"+":"−"}${fmt(Math.abs(d))}</span>`; }
function reviewCompare(prev,cur){ if(!prev) return [];
  const dd=(cur.dep==null||prev.dep==null)? null : cur.dep-prev.dep;
  return [["資產淨值",wan(prev.net),wan(cur.net),delta(prev.net,cur.net,wan)],["每月可儲",money(prev.sav),money(cur.sav),delta(prev.sav,cur.sav,money)],
    ["保障缺口",wan(prev.gap),wan(cur.gap),delta(prev.gap,cur.gap,wan,false)],["退休資金用到",depShow(prev),depShow(cur), dd? `<span class="${dd>0?"up":"down"}">${dd>0?"+":"−"}${Math.abs(dd)} 年</span>`:"–"]]; }
function renderReviews(D){
  const box=$("#rv-sum"); if(!box) return; const rs=reviews(); const every=N(S.follow&&S.follow.every)||6; const tr=rs.find(r=>r.d===today()); const last=lastReview(); const cur=tr||snapReview(D);
  const nextBase = tr? today() : last? last.d : null; const next = nextBase? addMonths(nextBase,every) : null; const overdue = !tr && last && monthsSince(last.d)>=every;
  box.innerHTML = rs.length? `<div class="rvline">${tr?`今日已記錄 Review。`:`上次一齊檢視：<b>${esc(last.d)}</b>（${Math.max(0,monthsSince(last.d))} 個月前）。`} 一共 ${rs.length} 次。　建議下次：<b class="${overdue?"bad":""}">${esc(next)}</b>${overdue?"（已經過咗時間）":""}</div>`
    : `<div class="rvline">未有 Review 紀錄。今日睇完撳「記錄今日 Review」，或者儲存檔案時剔「記錄為一次 Review」。建議每 ${every} 個月一齊檢視一次。</div>`;
  const prev=last; const cmp=reviewCompare(prev,cur);
  $("#rv-cmp").innerHTML = cmp.length? `<p class="lbl">對比上次（${esc(prev.d)}）${tr?"":"・今日數字未記錄"}</p><div class="tscroll"><table class="t"><thead><tr><th>項目</th><th>${esc(prev.d)}</th><th>${tr?"今日":"今日（現況）"}</th><th>變化</th></tr></thead><tbody>${cmp.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div>` : "";
  $("#rv-table").innerHTML = rs.length? `<caption class="lbl">全部紀錄（新到舊）</caption><thead><tr><th>日期</th><th>資產淨值</th><th>每月可儲</th><th>保障缺口</th><th>退休資金用到</th><th style="text-align:left">備註</th><th></th></tr></thead><tbody>`+
    rs.slice().reverse().map(r=>`<tr class="${r.d===today()?"hl":""}"><td>${esc(r.d)}</td><td>${wan(r.net)}</td><td>${money(r.sav)}</td><td>${wan(r.gap)}</td><td>${esc(depShow(r))}</td><td style="text-align:left;white-space:normal">${esc(r.note||"")}</td><td><button type="button" class="linkbtn rvdel" data-rvdel="${esc(r.d)}" aria-label="刪除 ${esc(r.d)} 紀錄">刪除</button></td></tr>`).join("")+"</tbody>" : "";

function route(){
  const id=current(), v=V[id];

function setupMore(){ $$("#main .card").forEach(card=>{ if(!card.querySelector(".more")) return; const h=card.querySelector("h3"); if(!h||h.querySelector(".morebtn")) return;
  h.insertAdjacentHTML("beforeend",`<button type="button" class="linkbtn morebtn">顯示全部項目</button>`); const b=h.querySelector(".morebtn");
  b.onclick=()=>{ card.classList.toggle("showall"); markZeros(); }; }); }
function markZeros(){ $$("#main .more").forEach(el=>{ const inp=el.querySelector("input[data-k]"); if(!inp) return; el.classList.toggle("zero", !N(getP(S,inp.dataset.k)) && document.activeElement!==inp); });
  $$("#main .card").forEach(card=>{ const b=card.querySelector(".morebtn"); if(!b) return; const open=card.classList.contains("showall"); const hid=$$(".more.zero",card).length;

/* minimal PDF writer: one full-page JPEG per page */
async function canvasesToPdf(pages){
  const enc=new TextEncoder(); const chunks=[]; let len=0; const offs=[];
  const push=b=>{ const u= typeof b==="string"? enc.encode(b) : b; chunks.push(u); len+=u.length; };
  const jpgs=[]; for(const c of pages){ const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.9)); jpgs.push(new Uint8Array(await blob.arrayBuffer())); }
  const n=pages.length, W=595.28, H=841.89; const obj=(id,body)=>{ offs[id]=len; push(`${id} 0 obj\n`); body(); push("\nendobj\n"); };
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>(3+i*3)+" 0 R").join(" ")}] >>`));
  pages.forEach((c,i)=>{ const p=3+i*3, cs=p+1, im=p+2; const content=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${cs} 0 R >>`));
    obj(cs,()=>{ push(`<< /Length ${content.length} >>\nstream\n`); push(content); push("\nendstream"); });
    obj(im,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgs[i].length} >>\nstream\n`); push(jpgs[i]); push("\nendstream"); }); });
  const size=3+n*3; const xref=len;
  push(`xref\n0 ${size}\n0000000000 65535 f \n`+Array.from({length:size-1},(_,k)=>String(offs[k+1]).padStart(10,"0")+" 00000 n \n").join(""));
  push(`trailer\n<< /Size ${size} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const out=new Uint8Array(len); let o=0; chunks.forEach(u=>{ out.set(u,o); o+=u.length; }); return out;
}

  if(DL){ try{ await DL.save({filename,data}); return true; }catch(e){ if(e&&e.code==="declined") return false; } }
  if(!window.claude){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:mime})); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); return true; }
  return null; }
async function saveJSON(){ const data=JSON.stringify({app:"wealth-tool",appVersion:APP_VERSION,...S},null,1); const fn=`財富分析_${safeName()}_${today()}.json`;
  const r=await deliver(fn,data,"application/json");
